services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override so the backend reaches Qdrant over the compose network,
      # not localhost. Takes precedence over QDRANT_URL in .env.
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      # Dev bind mount for live-reload-friendly iteration; harmless in prod.
      - ./backend/app:/app/app
      # Persist uploaded files across container restarts.
      - ./backend/storage:/app/storage

volumes:
  qdrant_storage:
